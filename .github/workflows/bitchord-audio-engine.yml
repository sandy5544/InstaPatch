name: BitChord audio engine validation

on:
  push:
    branches:
      - feature/bitchord-audio-engine-port
    paths:
      - 'patches/**'
      - 'tools/**'
      - '.github/workflows/bitchord-audio-engine.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: burrunan/gradle-cache-action@v3
      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Run DSP smoke tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:testBitChordAudioEngine --no-daemon
      - name: Generate patch metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: instapatch-bitchord-port-validation
          path: |
            patches/build/libs/*.mpp
            patches-list.json
