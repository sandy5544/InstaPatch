name: Build Auralis Player
on:
  push:
    branches: [standalone-player]
    paths:
      - "standalone-player/**"
      - ".github/workflows/auralis-build.yml"
  pull_request:
    paths:
      - "standalone-player/**"
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: standalone-player
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: auralis-player-debug
          path: standalone-player/app/build/outputs/apk/debug/app-debug.apk
