name: Build Auralis Player
on:
  push:
    branches: [standalone-player]
    paths:
      - "standalone-player/**"
      - ".github/workflows/auralis-build.yml"
  pull_request:
    paths:
      - "standalone-player/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: standalone-player
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: auralis-player-debug
          path: standalone-player/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish Auralis as its own GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: standalone-player/app/build/outputs/apk/debug/app-debug.apk
          TAG: auralis-v0.1.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH#Auralis Player APK" \
              --target "$GITHUB_SHA" \
              --title "Auralis Player v0.1.0" \
              --notes "Early development build of Auralis Player. This is not yet the completed BitChord + LastWave hybrid. See the standalone-player folder in the source branch for implemented features and current limitations."
          fi
