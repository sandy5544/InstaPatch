name: Publish BitChord experimental build

on:
  push:
    branches:
      - feature/bitchord-audio-engine-port
    paths:
      - .github/workflows/publish-bitchord-alpha.yml
      - patches/**
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-and-publish:
    name: Build and publish BitChord alpha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList --no-daemon

      - name: Publish experimental release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bitchord-v0.1.0-alpha.1
          name: BitChord audio engine port for YouTube Music 9.42.52 (Alpha 1)
          prerelease: true
          fail_on_unmatched_files: true
          files: patches/build/libs/patches-*.mpp
          body: |
            Experimental InstaPatch Morphe bundle containing the BitChord-inspired DSP and playback-policy foundation for YouTube Music 9.42.52.

            Included:
            - Force Opus preference patch.
            - BPM/onset estimation and conservative beat-aware transition planning primitives.
            - Biquad and multiband EQ, echo-out, RMS gain analysis and smoothed peak limiter primitives.
            - Network quality, silence-gate, sleep-timer, stream-statistics and authorised source-selection policies.
            - Automated build and smoke-test coverage.

            IMPORTANT: This is an experimental developer alpha. The DSP and playback policies are not yet wired into YouTube Music's live playback pipeline. No claim is made that crossfade, automix, EQ, sleep timer, silence skipping or external-source playback is active in the app. Applying the bundle to the target APK, DEX verification and real-device playback validation remain outstanding. Use only for testing; not a stable release.
